<title>Rust Avenue</title>
<meta name="description" content="A side-scrolling street brawler in the spirit of Streets of Rage 4.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0c0a14;
    --ink: #d2c8e4;
    --dim: #8a7f9e;
    --accent: #ff8a3d;
    --key: #221c30;
    --keyline: #3a3050;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 500 13px/1.4 "Chakra Petch", system-ui, sans-serif;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    height: 100%;
    box-sizing: border-box;
    padding-inline: 16px;
    padding-block: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  #stage {
    position: relative;
    width: min(100%, calc((100vh - 90px) * 16 / 9));
    max-width: 1440px;
  }
  canvas {
    display: block;
    width: 100%;
    max-width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 4px;
    box-shadow: 0 0 0 1px #2a2238, 0 24px 70px -24px rgba(255, 138, 61, .35);
    outline: none;
  }
  canvas:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  #help {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    justify-content: center;
    color: var(--dim);
    max-width: 980px;
  }
  #help span { white-space: nowrap; }
  kbd {
    font: 700 11px "Chakra Petch", ui-monospace, monospace;
    background: var(--key);
    color: var(--ink);
    border: 1px solid var(--keyline);
    border-bottom-width: 2px;
    border-radius: 3px;
    padding: 0 5px;
    letter-spacing: .04em;
  }
  #touch { display: none; }
  @media (pointer: coarse) {
    #help { display: none; }
    #stage { width: min(100%, calc(100vh * 16 / 9)); }
    #touch { display: block; }
  }
  #joy {
    position: fixed;
    left: calc(18px + env(safe-area-inset-left, 0px));
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    width: 132px; height: 132px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .07);
    border: 2px solid rgba(255, 255, 255, .18);
    touch-action: none;
  }
  #knob {
    position: absolute; left: 50%; top: 50%;
    width: 54px; height: 54px; margin: -27px 0 0 -27px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .22);
    pointer-events: none;
  }
  #btns {
    position: fixed;
    right: calc(18px + env(safe-area-inset-right, 0px));
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    display: grid;
    grid-template-columns: repeat(2, 66px);
    gap: 12px;
  }
  .tb {
    width: 66px; height: 66px;
    border-radius: 50%;
    border: 2px solid rgba(255, 138, 61, .7);
    background: rgba(255, 138, 61, .18);
    color: #fff;
    font: 12px "Bungee", system-ui, sans-serif;
    touch-action: none;
  }
  .tb.alt { border-color: rgba(62, 230, 214, .7); background: rgba(62, 230, 214, .15); }
  .tb.super { border-color: rgba(157, 230, 80, .8); background: rgba(157, 230, 80, .16); font-size: 10px; }
  #tpause {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top, 0px));
    right: calc(12px + env(safe-area-inset-right, 0px));
    width: 44px; height: 44px; font-size: 10px;
    border-color: rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .08);
  }
</style>

<div id="app">
  <div id="stage">
    <canvas id="game" width="960" height="540" tabindex="0" aria-label="Rust Avenue game screen"></canvas>
  </div>
  <div id="help">
    <span><kbd>←↑↓→</kbd> / <kbd>WASD</kbd> move</span>
    <span><kbd>J</kbd> staff combo · hold to charge Spirit Spear</span>
    <span><kbd>K</kbd> / <kbd>Space</kbd> jump</span>
    <span><kbd>L</kbd> Tidal Vortex · <kbd>→</kbd>+<kbd>L</kbd> Flame Fist · <kbd>↑</kbd>/<kbd>↓</kbd>+<kbd>L</kbd> Verdant Rise · air <kbd>L</kbd> Gale Dive</span>
    <span><kbd>U</kbd> Elemental Awakening · <kbd>U</kbd> again for Cataclysm</span>
    <span>double-tap <kbd>→</kbd> run</span>
    <span>walk into an enemy to grab, back + <kbd>J</kbd> throw</span>
    <span><kbd>P</kbd> pause</span>
    <span><kbd>M</kbd> music</span>
  </div>
  <div id="touch">
    <div id="joy"><div id="knob"></div></div>
    <div id="btns">
      <button class="tb alt" data-a="spec">SPL</button>
      <button class="tb alt" data-a="jump">JMP</button>
      <button class="tb super" data-a="super">SUPER</button>
      <button class="tb" data-a="atk">ATK</button>
    </div>
    <button class="tb" id="tpause" data-a="pause">II</button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ---------------------------------------------------------------- setup */
const cv = document.getElementById('game');
let ctx = cv.getContext('2d');
const W = 960, H = 540;
const GROUND = 335;            // back edge of the sidewalk
const YMIN = 348, YMAX = 508;  // walkable depth band
const GRAV = 0.55;
const LEVEL_END = 4300;
const PI = Math.PI, TAU = PI * 2;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const sgn = v => v < 0 ? -1 : v > 0 ? 1 : 0;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255), g = clamp((n >> 8 & 255) + amt, 0, 255), b = clamp((n & 255) + amt, 0, 255);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}

let K = 1;
function resize() {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(320, Math.round(r.width * dpr));
  cv.height = Math.round(cv.width * 9 / 16);
  K = cv.width / W;
}
addEventListener('resize', resize);

/* ---------------------------------------------------------------- input */
let frame = 0;
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  KeyJ: 'atk', KeyZ: 'atk', KeyK: 'jump', KeyX: 'jump', Space: 'jump',
  KeyL: 'spec', KeyC: 'spec', KeyU: 'super', KeyV: 'super', Enter: 'start', KeyP: 'pause', Escape: 'pause', KeyM: 'music'
};
const held = {}, vheld = {}, taps = new Set();
let runReq = 0;
const lastTap = { left: -99, right: -99 };
const lastDir = { left: -99, right: -99, up: -99, down: -99 };
function press(a) {
  taps.add(a);
  if (a in lastDir) lastDir[a] = frame;
  if (a === 'left' || a === 'right') {
    if (frame - lastTap[a] < 16) runReq = a === 'left' ? -1 : 1;
    lastTap[a] = frame;
  }
  initAudio();
}
addEventListener('keydown', e => {
  const a = KEYMAP[e.code]; if (!a) return;
  e.preventDefault();
  if (!held[e.code]) press(a);
  held[e.code] = true;
});
addEventListener('keyup', e => { if (KEYMAP[e.code]) held[e.code] = false; });
addEventListener('blur', () => { for (const k in held) held[k] = false; for (const k in vheld) vheld[k] = false; });
function isHeld(a) {
  if (vheld[a]) return true;
  for (const c in held) if (held[c] && KEYMAP[c] === a) return true;
  return false;
}
const tapped = a => taps.has(a);

// touch controls
cv.addEventListener('pointerdown', () => { cv.focus(); press('start'); });
document.querySelectorAll('.tb').forEach(b => {
  const a = b.dataset.a;
  const up = e => { vheld[a] = false; e.preventDefault(); };
  b.addEventListener('pointerdown', e => { e.preventDefault(); vheld[a] = true; press(a); if (a === 'atk' || a === 'jump') press('start'); });
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
});
(() => {
  const joy = document.getElementById('joy'), knob = document.getElementById('knob');
  let pid = null;
  const setDir = (d, on) => { if (on && !vheld[d]) press(d); vheld[d] = on; };
  const move = e => {
    const r = joy.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const m = Math.hypot(dx, dy), max = r.width / 2 - 20;
    if (m > max) { dx *= max / m; dy *= max / m; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    const th = max * 0.35;
    setDir('left', dx < -th); setDir('right', dx > th); setDir('up', dy < -th); setDir('down', dy > th);
  };
  const end = () => { pid = null; knob.style.transform = ''; ['left', 'right', 'up', 'down'].forEach(d => vheld[d] = false); };
  joy.addEventListener('pointerdown', e => { e.preventDefault(); pid = e.pointerId; joy.setPointerCapture(pid); press('start'); move(e); });
  joy.addEventListener('pointermove', e => { if (e.pointerId === pid) move(e); });
  joy.addEventListener('pointerup', end); joy.addEventListener('pointercancel', end);
})();

/* ---------------------------------------------------------------- audio */
let AC = null, master, sfxGain, musicGain, noiseBuf, musicOn = true, nextNote = 0, step = 0;
function initAudio() {
  try {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
    sfxGain = AC.createGain(); sfxGain.connect(master);
    musicGain = AC.createGain(); musicGain.gain.value = 0.2; musicGain.connect(master);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    nextNote = AC.currentTime + 0.1;
  } catch (e) { AC = null; }
}
function noise(t, dur, freq, q, gain, type = 'bandpass', dest = sfxGain) {
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(dest); s.start(t); s.stop(t + dur + 0.02);
}
function tone(t, dur, f0, f1, gain, type = 'sine', dest = sfxGain) {
  const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.02);
}
function sfx(k) {
  if (!AC) return;
  const t = AC.currentTime;
  switch (k) {
    case 'whiff': noise(t, 0.07, 2600, 1, 0.12); break;
    case 'slash': noise(t, 0.12, 5200, 2, 0.3, 'highpass'); break;
    case 'hit': noise(t, 0.08, 1400, 0.8, 0.5); tone(t, 0.11, 190, 60, 0.55); break;
    case 'heavy': noise(t, 0.16, 900, 0.7, 0.7); tone(t, 0.22, 150, 38, 0.9, 'triangle'); break;
    case 'thud': tone(t, 0.18, 95, 35, 0.6); noise(t, 0.12, 300, 1, 0.3, 'lowpass'); break;
    case 'pickup': tone(t, 0.08, 660, 0, 0.2, 'square'); tone(t + 0.08, 0.14, 990, 0, 0.2, 'square'); break;
    case 'break': noise(t, 0.35, 1800, 0.5, 0.5); tone(t, 0.1, 300, 80, 0.35, 'square'); break;
    case 'special': tone(t, 0.35, 220, 880, 0.2, 'sawtooth'); noise(t, 0.35, 3000, 0.5, 0.22, 'highpass'); break;
    case 'hurt': tone(t, 0.14, 320, 120, 0.25, 'square'); break;
    case 'go': tone(t, 0.1, 880, 0, 0.18, 'square'); tone(t + 0.15, 0.1, 880, 0, 0.18, 'square'); break;
    case 'boom': noise(t, 0.6, 400, 0.5, 0.9, 'lowpass'); tone(t, 0.5, 80, 30, 1); break;
    case 'throw': noise(t, 0.2, 1200, 0.6, 0.3); tone(t, 0.2, 400, 150, 0.2, 'triangle'); break;
    case 'fire': noise(t, 0.4, 700, 0.6, 0.55, 'lowpass'); tone(t, 0.3, 180, 620, 0.14, 'sawtooth'); break;
    case 'water': noise(t, 0.45, 1100, 3, 0.4); noise(t + 0.1, 0.3, 1700, 3, 0.25); break;
    case 'wind': noise(t, 0.55, 2400, 0.4, 0.35); break;
    case 'root': tone(t, 0.28, 75, 38, 0.8, 'triangle'); noise(t, 0.22, 500, 0.8, 0.5); break;
    case 'charge': tone(t, 0.18, 880, 1760, 0.14, 'triangle'); break;
    case 'beam': tone(t, 0.5, 1200, 300, 0.2, 'sawtooth'); noise(t, 0.4, 4000, 0.5, 0.3, 'highpass'); break;
    case 'awaken':
      [220, 277, 330, 440].forEach((f, i) => tone(t + i * 0.07, 1.0, f, f * 2, 0.1, 'sawtooth'));
      noise(t, 1.0, 3000, 0.3, 0.3, 'highpass'); break;
  }
}
// four-bar house loop in A minor
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const ROOTS = [45, 41, 43, 40];
const CHORDS = [[57, 60, 64], [53, 57, 60], [55, 59, 62], [52, 56, 59]];
const BASS_STEPS = [0, 3, 6, 8, 10, 11, 14];
function playStep(s, t) {
  const bar = (s >> 4) & 3, b = s & 15, dest = musicGain;
  if (b % 4 === 0) tone(t, 0.22, 150, 42, 0.9, 'sine', dest);
  if (b === 4 || b === 12) noise(t, 0.16, 1800, 0.7, 0.45, 'bandpass', dest);
  if (b % 2 === 0) noise(t, 0.03, 9000, 1, 0.12, 'highpass', dest);
  if (b % 4 === 2) noise(t, 0.09, 8000, 1, 0.18, 'highpass', dest);
  if (BASS_STEPS.includes(b)) {
    const n = ROOTS[bar] + (b === 6 || b === 14 ? 12 : 0);
    const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(n);
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(180, t + 0.18);
    const g = AC.createGain(); g.gain.setValueAtTime(0.45, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    o.connect(f); f.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.22);
  }
  if (b === 3 || b === 11 || (b === 14 && bar % 2)) {
    for (const n of CHORDS[bar]) tone(t, 0.16, mtof(n + 12), 0, 0.05, 'square', dest);
  }
}
function scheduleMusic() {
  if (!AC || !musicOn || AC.state !== 'running') return;
  const dur = 60 / 124 / 4;
  if (nextNote < AC.currentTime - 0.2) nextNote = AC.currentTime + 0.05;
  while (nextNote < AC.currentTime + 0.12) { playStep(step, nextNote); nextNote += dur; step = (step + 1) & 63; }
}

/* ---------------------------------------------------------------- poses */
// [lean, head, frontArm upper, frontArm elbow, backArm upper, backArm elbow,
//  frontLeg thigh, frontLeg knee, backLeg thigh, backLeg knee, spare, rotation]
const POSE = {
  idle:    [0.08, 0, 0.5, 2.0, 0.25, 2.2, 0.28, -0.35, -0.22, -0.1, 0, 0],
  jab:     [0.18, 0, 1.55, 0.05, 0.2, 2.2, 0.35, -0.3, -0.3, -0.05, 0, 0],
  jab2:    [0.22, 0, 0.4, 2.2, 1.55, 0.05, 0.35, -0.3, -0.3, -0.05, 0, 0],
  cross:   [0.32, 0.05, 0.1, 2.3, 1.6, 0, 0.45, -0.45, -0.35, 0, 0, 0],
  chamber: [-0.1, 0, 0.4, 1.6, -0.3, 1.6, 1.3, -2.2, -0.05, 0, 0, 0],
  kick:    [-0.35, 0.15, 0.6, 1.2, -0.5, 1.4, 1.65, -0.05, -0.08, 0, 0, 0],
  jump:    [0.1, 0, 0.9, 1.5, -0.3, 1.8, 0.9, -1.7, 0.3, -1.3, 0, 0],
  jkick:   [-0.25, 0.1, 0.7, 1.4, -0.6, 1.3, 1.45, -0.1, 0.25, -1.9, 0, 0],
  knee:    [0.15, 0, 1.2, 0.5, 1.1, 0.7, 1.35, -2.3, -0.2, 0, 0, 0],
  hurt:    [-0.45, -0.35, -0.3, 0.9, -0.8, 0.7, 0.35, -0.25, -0.3, -0.2, 0, 0],
  fall:    [-0.3, -0.3, -1.6, 0.4, -2.2, 0.3, 0.6, -0.4, 0.2, -0.2, 0, -1.1],
  down:    [0, -0.1, -2.4, 0.3, -2.0, 0.2, 0.15, -0.1, -0.1, -0.05, 0, -PI / 2],
  getup:   [0.55, 0, 0.9, 0.6, 0.6, 0.8, 0.9, -1.8, -0.2, -1.2, 0, 0],
  grab:    [0.2, 0, 1.3, 0.35, 1.2, 0.55, 0.3, -0.3, -0.3, -0.1, 0, 0],
  throw:   [-0.45, 0, 2.6, 0.2, 2.4, 0.3, 0.3, -0.3, -0.35, -0.1, 0, 0],
  spin:    [0, 0, 1.57, 0.05, -1.57, -0.05, 0.5, -0.2, -0.5, -0.2, 0, 0],
  windup:  [-0.12, 0, -0.5, 1.7, 0.4, 2.0, 0.3, -0.3, -0.3, -0.1, 0, 0],
  slashUp: [-0.1, 0, 2.7, 0.3, 0.2, 2.0, 0.3, -0.3, -0.3, -0.1, 0, 0],
  slash:   [0.35, 0, 0.9, 0.1, -0.3, 1.6, 0.5, -0.5, -0.4, 0, 0, 0],
  crouch:  [0.4, 0, 0.8, 1.6, 0.4, 1.8, 0.6, -1.2, -0.3, -0.8, 0, 0],
  shoulder:[0.55, 0, 0.9, 1.9, 0.5, 2.0, 0.6, -0.5, -0.6, -0.2, 0, 0],
  swingUp: [-0.15, 0, 2.8, 0.1, 0.2, 2.0, 0.3, -0.3, -0.3, -0.1, 0, 0],
  swing:   [0.3, 0, 1.2, 0.05, 0.3, 2.0, 0.45, -0.45, -0.35, 0, 0, 0],
  victory: [0, -0.15, 3.0, 0.1, 0.3, 2.2, 0.2, -0.1, -0.2, -0.1, 0, 0],
};
POSE.grabbed = POSE.hurt;

function walkPose(ph, run) {
  const p = POSE.idle.slice(), s = Math.sin(ph), amp = run ? 0.85 : 0.5;
  p[0] = run ? 0.38 : 0.12;
  p[6] = 0.08 + s * amp; p[7] = -0.35 - Math.max(0, -s) * (run ? 1.2 : 0.7);
  p[8] = 0.08 - s * amp; p[9] = -0.35 - Math.max(0, s) * (run ? 1.2 : 0.7);
  p[2] = 0.5 - s * (run ? 0.6 : 0.15); p[4] = 0.25 + s * (run ? 0.6 : 0.15);
  return p;
}

// Shen's poses add two values: staff angle (0 = pointing down, PI/2 = forward, PI = up)
// and grip (where along the staff his back hand holds it, 0 = butt, 1 = blade).
const HPOSE = {
  idle:   [0.05, 0, 0.9, 1.2, 0.55, 1.25, 0.28, -0.35, -0.22, -0.1, 0, 0, PI - 0.12, 0.3],
  jump:   [0.1, 0, 0.9, 1.5, 0.4, 1.4, 0.9, -1.7, 0.3, -1.3, 0, 0, PI - 0.8, 0.4],
  s1w:    [0, 0, 0.4, 2.0, 0.5, 1.6, 0.3, -0.3, -0.3, -0.1, 0, 0, PI / 2, 0.62],
  s1:     [0.28, 0, 0.3, 2.1, 1.45, 0.1, 0.6, -0.5, -0.5, 0, 0, 0, PI / 2, 0.28],
  s2w:    [-0.1, 0, 0.5, 1.8, 2.3, 0.4, 0.35, -0.3, -0.3, -0.1, 0, 0, 2.7, 0.3],
  s2:     [0.3, 0.1, 0.3, 2.0, 1.2, 0.2, 0.6, -0.5, -0.5, 0, 0, 0, 1.0, 0.3],
  s4w:    [-0.25, 0, 0.8, 1.6, 2.9, 0.2, 0.3, -0.3, -0.35, -0.1, 0, 0, -2.6, 0.15],
  s4:     [0.5, 0.1, 0.4, 1.8, 1.25, 0.1, 0.95, -0.9, -0.55, 0, 0, 0, 1.3, 0.15],
  lunge:  [0.5, 0, 0.4, 2.0, 1.5, 0.05, 0.9, -0.4, -0.8, -0.1, 0, 0, PI / 2, 0.2],
  charge: [-0.15, 0, 0.5, 1.8, 0.3, 1.8, 0.4, -0.4, -0.4, -0.1, 0, 0, PI / 2 + 0.1, 0.75],

/* ---------------------------------------------------------------- waves & camera */
function updateWaves() {

  }

      if (spawnQ.length && spawnT <= 0 && live < wave.max) {

    if (bossRef && bossRef.hp > 0) {

      if (bossRef.hp < 110 && !bossRef.s2) { bossRef.s2 = 1; spawnQ.push('knife', 'thug', 'thug'); }

}

/* ---------------------------------------------------------------- update */
function update() {
  frame++;

  if (gs === 'title') {
    camX = (Math.sin(frame * 0.002) * 0.5 + 0.5) * 1400;
    if (tapped('start') || tapped('atk') || tapped('jump')) startGame();
    taps.clear(); return;
  }
  if (gs === 'over') {
    contT--;
    if (tapped('start') || tapped('atk')) { gs = 'play'; lives = 2; score = Math.floor(score / 2); respawn(); }
    else if (contT <= 0) gs = 'title';
    taps.clear(); return;
  }
  if (gs === 'win') {
    if (tapped('start') || tapped('atk')) gs = 'title';
    taps.clear(); return;
  }
  if (tapped('pause')) { gs = gs === 'pause' ? 'play' : 'pause'; taps.delete('pause'); }
  if (gs === 'pause') { taps.clear(); return; }
  if (slowT > 0 && --slowT === 0) timeScale = 1;
  if (bannerT > 0) bannerT--;
  if (goT > 0) goT--;
  if (hudEnemyT > 0) hudEnemyT--;
  for (const b of props) if (b.flash > 0) b.flash--;
  if (flashT > 0) flashT--;
  if (hitstop > 0) { hitstop--; if (shake > 0) shake *= 0.85; return; }
  if (superFreeze > 0) {
    superFreeze--;
    updatePlayer(); updateParts();
    taps.clear(); return;
  }
  assignAggro();
  updatePlayer();
  for (const e of enemies) updateEnemy(e);
  updateProjs();
  separate();
  enemies = enemies.filter(e => !(e.state === 'dead' && e.t > 50));
  if (bossRef && !enemies.includes(bossRef)) bossRef = bossRef.hp > 0 ? bossRef : null;
  updateItems();
  updateParts();
  updateWaves();
  updateCamera();
  if (shake > 0) shake = shake < 0.3 ? 0 : shake * 0.85;
  taps.clear();
}

function updatePoses(list) {
  for (const f of list) {
    if (f.hero) {
      const tp = heroPose(f);
      const k = f.state === 'atk' && (f.atk.dyn || f.t >= f.atk.act[0]) ? (f.atk.dyn ? 1 : 0.7) : 0.4;
      for (let i = 0; i < 14; i++) {
        let d = tp[i] - f.dp[i];
        if (i === 12) d = ((d + PI) % TAU + TAU) % TAU - PI;
        f.dp[i] += d * k;
      }
      continue;
    }
    let tp;
    switch (f.state) {
      case 'idle': { tp = POSE.idle.slice(); const b = Math.sin((frame + f.id * 13) * 0.08) * 0.05; tp[3] += b; tp[5] -= b; break; }
      case 'walk': tp = walkPose(f.wt, f.running); break;
      case 'jump': tp = POSE.jump; break;
      case 'atk': {
        const a = f.atk;
        if (a.slam) tp = f.z > 0 ? POSE.jump : POSE.crouch;
        else tp = f.t < a.act[0] ? POSE[a.wind] : POSE[a.pose];
        break;
      }
      case 'hurt': case 'grabbed': tp = POSE.hurt; break;
      case 'fall': tp = POSE.fall; break;
      case 'down': case 'dead': tp = POSE.down; break;
      case 'getup': tp = POSE.getup; break;
      case 'grab': tp = POSE.grab; break;
      case 'victory': tp = POSE.victory; break;
      default: tp = POSE.idle;
    }
    const k = f.state === 'atk' && f.t >= f.atk.act[0] ? 0.7 : 0.4;
    for (let i = 0; i < 12; i++) f.dp[i] += (tp[i] - f.dp[i]) * k;
  }
}
function render() {
  ctx.setTransform(K, 0, 0, K, 0, 0);
  const sx = shake ? rand(-shake, shake) : 0, sy = shake ? rand(-shake, shake) * 0.6 : 0;
  ctx.save(); ctx.translate(sx, sy);
  drawBackground();
  if (superFreeze > 0 && gs === 'play') {
    ctx.fillStyle = 'rgba(6,4,20,.6)'; ctx.fillRect(0, 0, W, H);
    const px = player.x - camX, py = player.y - 60;
    const g = ctx.createRadialGradient(px, py, 10, px, py, 220);
    g.addColorStop(0, 'rgba(160,240,255,.35)'); g.addColorStop(1, 'rgba(160,240,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (gs !== 'title') {
    const fighters = [player, ...enemies];
    updatePoses(fighters);
    for (const b of props) drawShadow(b.x, b.y, 0, 20);
    for (const it of items) drawShadow(it.x, it.y, it.z, 14);
    for (const f of fighters) if (!(f.state === 'dead' && frame % 6 < 3)) drawShadow(f.x, f.y, f.z, 24 * f.scale);
    const list = [...props.map(o => ({ y: o.y, d: () => drawProp(o) })), ...items.map(o => ({ y: o.y - 0.5, d: () => drawItem(o) })), ...fighters.map(o => ({ y: o.y, d: () => drawFighter(o) })),
      ...projs.map(o => ({ y: o.y + 1, d: () => drawFireball(o) })), ...erupts.filter(o => o.delay <= 0).map(o => ({ y: o.y - 1, d: () => drawErupt(o) }))];
    if (player.superT > 0 && !['down', 'dead', 'fall'].includes(player.state)) for (const o of orbPositions(player)) list.push({ y: o.y, d: () => drawOrb(o) });
    for (const q of projs) drawShadow(q.x, q.y, q.z, 14);
    list.sort((a, b) => a.y - b.y);
    for (const o of list) o.d();
    ctx.filter = 'none';
    drawParts();
  }
  drawForeground();
  ctx.restore();
  if (flashT > 0) { ctx.globalAlpha = flashT / 18; ctx.fillStyle = flashC; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (gs === 'title') { drawTitle(); return; }
  drawHUD();
  if (gs === 'pause') { ctx.fillStyle = 'rgba(8,6,14,.6)'; ctx.fillRect(0, 0, W, H); bigText('PAUSED', 280, 60, '#fff'); }
  if (gs === 'over') {
    ctx.fillStyle = 'rgba(8,6,14,.7)'; ctx.fillRect(0, 0, W, H);
    bigText('GAME OVER', 240, 64, '#ff3d6e');
    ctx.font = '700 18px "Chakra Petch", sans-serif'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.fillText('CONTINUE?  ' + Math.ceil(contT / 60) + '   ·   PRESS ENTER OR ATTACK', W / 2, 300);
  }
  if (gs === 'win') {
    ctx.fillStyle = 'rgba(8,6,14,.65)'; ctx.fillRect(0, 0, W, H);
    bigText('STREET CLEARED', 230, 56, '#ffd23f');
    ctx.font = '700 20px "Chakra Petch", sans-serif'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.fillText('FINAL SCORE  ' + score, W / 2, 280);
    ctx.font = '700 14px "Chakra Petch", sans-serif'; ctx.fillStyle = '#b9aed0'; ctx.fillText('PRESS ENTER TO PLAY AGAIN', W / 2, 320);
  }
}


/* ---------------------------------------------------------------- sprite sheet export */
// Renders Shen's key frames into one sheet with the same pipeline the game uses.
function renderSheet() {
  const F = [], add = (name, pose, o = {}) => F.push({ name, pose, o });
  const staffWalk = (ph, run) => { const p = walkPose(ph, run).concat([PI - 0.3 - Math.sin(ph) * 0.08, 0.3]); p[4] = run ? 1.0 : 0.55; p[5] = run ? 0.6 : 1.25; if (run) { p[12] = PI / 2 + 0.25; p[13] = 0.45; } return p; };
  for (let i = 0; i < 4; i++) { const p = HPOSE.idle.slice(); p[3] += Math.sin(i * PI / 2) * 0.05; add('idle_' + i, p); }
  for (let i = 0; i < 6; i++) add('walk_' + i, staffWalk(i * PI / 3, false));
  for (let i = 0; i < 4; i++) add('run_' + i, staffWalk(i * PI / 2, true));
  ['s1w', 's1', 's2w', 's2'].forEach(n => add('combo_' + n, HPOSE[n]));
  for (let i = 0; i < 3; i++) add('combo_twirl_' + i, [0.1, 0, 0.6, 1.6, 1.4, 0.2, 0.45, -0.4, -0.4, -0.05, 0, 0, PI / 2 + i * 2.1, 0.5]);
  add('combo_s4w', HPOSE.s4w); add('combo_s4', HPOSE.s4);
  add('jump', HPOSE.jump);
  for (let i = 0; i < 2; i++) add('air_spin_' + i, [-0.1, 0, 0.9, 1.4, 1.3, 0.2, 1.0, -1.8, 0.3, -1.4, 0, 0, i * 2.5, 0.5]);
  add('gale_dive', HPOSE.dive); add('spear_lunge', HPOSE.lunge);
  add('charge', HPOSE.charge, { charge: 1 }); add('spirit_spear', HPOSE.spirit, { charge: 1 });
  add('flame_fist_wind', HPOSE.castw); add('flame_fist', HPOSE.cast);
  add('verdant_rise_wind', HPOSE.rootw); add('verdant_rise', HPOSE.root);
  for (let i = 0; i < 2; i++) add('tidal_vortex_' + i, [0, 0, 1.57, 0.05, -1.2, 0.2, 0.55, -0.2, -0.55, -0.2, 0, 0, i * 1.6, 0.5]);
  ['grab', 'throw', 'hurt', 'fall', 'down', 'getup', 'victory'].forEach(n => add(n, heroPoseFor(n)));
  add('awaken', HPOSE.awaken, { sup: 1 }); add('cataclysm', HPOSE.cata, { sup: 1 });
  add('super_idle', HPOSE.idle, { sup: 1 }); add('super_thrust', HPOSE.s1, { sup: 1 });
  const cols = 8, rows = Math.ceil(F.length / cols);
  const sheet = makeCanvas(cols * SPW, rows * SPH), g = sheet.getContext('2d');
  const f = makeHero();
  F.forEach((fr, i) => {
    f.dp = fr.pose.slice(); f.superT = fr.o.sup ? 100 : 0; f.chargeT = fr.o.charge ? 50 : 0;
    g.drawImage(renderSprite(f, 1, fr.o.sup ? '#35a6ff' : '#120a18'), (i % cols) * SPW, (i / cols | 0) * SPH);
  });
  return {
    png: sheet.toDataURL('image/png'),
    atlas: { image: 'shen-sprites.png', cell: { w: SPW, h: SPH }, origin: { x: SPOX, y: SPOY }, pixelScale: PIX,
      frames: F.map((fr, i) => ({ name: fr.name, x: (i % cols) * SPW, y: (i / cols | 0) * SPH })) }
  };
}

/* ---------------------------------------------------------------- loop */
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function loop(now) {
  const dt = Math.min(100, now - last); last = now;
  acc += dt * timeScale;
  let n = 0;
  while (acc >= STEP && n++ < 5) { update(); acc -= STEP; }
  if (n >= 5) acc = 0;
  render();
  scheduleMusic();
  requestAnimationFrame(loop);
}
function start() {
  resize();
  player = makeHero();
  requestAnimationFrame(t => { last = t; loop(t); });
  if (document.fonts && document.fonts.load) { document.fonts.load('20px Bungee'); document.fonts.load('700 14px "Chakra Petch"'); }
  window.__game = {
    get state() { return { gs, score, lives, waveIdx, camX, enemies: enemies.length, player: player && { x: player.x, hp: player.hp, state: player.state, atk: player.atkName, sp: player.sp, superT: player.superT } }; },
    fillSuper() { player.sp = 100; },
    renderSheet,
  };
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start();
})();
</script>
